version: 1
project:
  name: acme-api
  stack:
    - typescript
    - node20
    - postgres
  commands:
    test: pnpm test
    build: pnpm build
    lint: pnpm lint
  monorepo:
    packages:
      - "packages/*"
  invariants:
    - Correlate accounts by persistent user ID, never email.
    - All money math in integer cents.
  models:
    primary:
      family: claude
      tier: strong
    judge:
      family: openai
      tier: strong
  review_bandwidth: 3
harnesses:
  - claude-code
  - codex
pathway:
  profile: accuracy-max
registries:
  - builtin
primitives:
  instructions:
    template: builtin:AGENTS.template
    blocks:
      - scope: project
        content: |
          ## Domain rules
          - API handlers never touch the DB directly; go through repositories.
      - scope: "path:packages/web/**"
        content: |
          React function components only; no class components.
  skills:
    - spec-first
    - verify-loop
    - lessons-loop
  agents:
    - explorer
    - verify-app
    - critic
    - security-reviewer
  commands:
    - commit-pr
    - fix-ci
    - add-learning
  mcp:
    - name: github
      transport: stdio
      command: npx -y @modelcontextprotocol/server-github
      env:
        - GITHUB_TOKEN
      scopes:
        - repo:read
      trust: write
  hooks:
    - block-dangerous-commands
  permissions:
    mutate_allow:
      - "pnpm *"
      - "git commit *"
      - git push origin HEAD
    irreversible:
      - git push origin main
      - db:migrate up
    unattended: none
  loops:
    - name: green-tests
      goal: all workspace tests pass
      verify: pnpm test
      plan_gate: true
      stops:
        max_iterations: 40
        no_progress_after: 3
        budget_usd: 25
state:
  dir: tasks/
