# balanced — the daily driver. Most teams live here and reach for accuracy-max on the few changes
# that warrant it.
profile: balanced

reasoning:
  effort: high
  model_tier: strong

retrieval:
  strategy: router         # router + corrective on weak evidence
  decomposition: false
  graph: auto              # only when the query is relationship/impact-shaped
  rerank: true
  top_k: 8

verification:
  self_check: true
  verify_subagent: true    # one verify pass
  reviewer_subagent: false
  llm_judge: false
  security_review: auto    # on sensitive paths only

orchestration:
  multi_agent: when_needed # only when one context genuinely can't hold the task
  subagents: moderate
  worktrees: true

context:
  compaction: summarize

guardrails:
  max_iterations: 40
  no_progress_stop: 3
  budget_usd: 25.0
